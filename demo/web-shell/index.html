<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mapidex - demo (web mirror)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #3a3a3a; color: #ddd;
    font-family: ui-monospace, Menlo, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 20px 12px;
  }
  .pd {
    background: #ffc83d; border-radius: 28px; padding: 22px 22px 18px;
    box-shadow: 0 12px 0 #c99200, 0 18px 40px rgba(0,0,0,.45);
    width: 460px; user-select: none;
  }
  .pd-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 4px; }
  .pd-logo { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; color: #5a3a00; text-transform: uppercase; }
  .lcd-bezel { background: #1a1a1a; border-radius: 6px; padding: 8px; width: 416px; height: 256px; }
  #lcd { width: 400px; height: 240px; display: block; image-rendering: pixelated; background: #fff; cursor: ns-resize; }
  .pd-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding: 0 8px; }
  .dpad { display: grid; grid-template-columns: 22px 22px 22px; grid-template-rows: 22px 22px 22px; gap: 1px; }
  .dpad button { background: #2a2a2a; color: #eee; border: 0; font: inherit; font-size: 10px; cursor: pointer; border-radius: 3px; }
  .dpad .c { background: #2a2a2a; border-radius: 0; }
  .crank { display: flex; gap: 4px; align-items: center; color: #5a3a00; font-size: 9px; font-weight: 700; }
  .crank button { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #8a6a10; background: #ffe08a; color: #5a3a00; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
  .ab { display: flex; gap: 12px; }
  .ab button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: #2a2a2a; color: #eee; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .ab button:active, .dpad button:active, .crank button:active { filter: brightness(1.6); }
  .ext { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .ext button { font: inherit; font-size: 11px; background: #222; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .note { font-size: 11px; color: #999; text-align: center; max-width: 470px; line-height: 1.45; }
  .note b { color: #ddd; }
</style>
</head>
<body>
<div class="pd">
  <div class="pd-top"><span class="pd-logo">Playdate - Mapidex demo</span><span class="pd-logo" id="snd">sound off</span></div>
  <div class="lcd-bezel"><canvas id="lcd" width="400" height="240"></canvas></div>
  <div class="pd-bottom">
    <div class="dpad">
      <span></span><button data-k="up">^</button><span></span>
      <button data-k="left">&lt;</button><span class="c"></span><button data-k="right">&gt;</button>
      <span></span><button data-k="down">v</button><span></span>
    </div>
    <div class="crank"><button data-k="crankDown">-</button>crank<button data-k="crankUp">+</button></div>
    <div class="ab"><button data-k="b">B</button><button data-k="a">A</button></div>
  </div>
</div>
<div class="ext">
  <button id="btnMute">mute (M)</button>
  <button id="btnReset">reset saves</button>
  <button id="btnFeed">reload last_feed.json</button>
</div>
<div class="note">
  <b>Keys:</b> arrows = d-pad &middot; X / Enter = A &middot; Z / Backspace = B &middot; [ ] or mouse wheel on screen = crank &middot; M = mute
</div>

function unlockAudio() {
  if (audioReady) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    SFX_NAMES.forEach(n => {
      fetch("sfx/" + n + ".wav").then(r => r.arrayBuffer())
        .then(b => actx.decodeAudioData(b)).then(buf => { sfxBuf[n] = buf; })
        .catch(() => {});
    });
  } catch (e) { actx = null; }
  audioReady = true;
  updateSndLabel();

}
function sfx(name) {
  if (muted || !audioReady) return;
  const buf = sfxBuf[name];
  if (actx && buf) {
    const src = actx.createBufferSource();
    const gain = actx.createGain();
    const isLong = name in LONG_SFX;
    if (isLong) stopLong();
    gain.gain.value = isLong ? LONG_SFX[name] : (name === "fanfare" ? 0.7 : 0.9);
    src.buffer = buf; src.connect(gain); gain.connect(actx.destination); src.start();
    if (isLong) longSrc = src;
    return;
  }
  const el = sfxEl[name];
  if (el) { try { if (name in LONG_SFX) stopLong(); const c = el.cloneNode(); c.play().catch(() => {}); if (name in LONG_SFX) longSrc = c; } catch (e) {} }
}

function prepDerived() {
  const bayer = [
    [0,32,8,40,2,34,10,42],[48,16,56,24,50,18,58,26],[12,44,4,36,14,46,6,38],[60,28,52,20,62,30,54,22],

  ditherField = document.createElement("canvas"); ditherField.width = W; ditherField.height = H;
  const dc = ditherField.getContext("2d"); const dd = dc.createImageData(W, H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const on = bayer[y & 7][x & 7] < 16; const p = (y * W + x) * 4;
    const v = on ? 0 : 255; dd.data[p] = dd.data[p+1] = dd.data[p+2] = v; dd.data[p+3] = 255;
  }
  dc.putImageData(dd, 0, 0);
  logoInk = document.createElement("canvas"); logoInk.width = W; logoInk.height = H;
  const lc = logoInk.getContext("2d");
  if (IMG.splash) {
    lc.drawImage(IMG.splash, 0, 0);
    const ld = lc.getImageData(0, 0, W, H);
    for (let p = 0; p < ld.data.length; p += 4) {
      const dark = ld.data[p] < 128;
      ld.data[p] = ld.data[p+1] = ld.data[p+2] = 0; ld.data[p+3] = dark ? 255 : 0;
    }
    lc.putImageData(ld, 0, 0);
  }
  // seeded shuffle for chunky density reveal
  let seed = 1234567;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const n = (W / 8) * (H / 8); loadOrder = [];
  for (let i = 0; i < n; i++) loadOrder.push(i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = loadOrder[i]; loadOrder[i] = loadOrder[j]; loadOrder[j] = t; }
}

let Feed = JSON.parse(JSON.stringify(BAKED_FEED));

function ascii(s) {
  return String(s == null ? "" : s)
    .replace(/[\u00b7\u2022]/g, "-").replace(/[\u2013\u2014]/g, "-")
    .replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .normalize("NFD").replace(/[^\x20-\x7e]/g, "");
}
function asciiDeep(o) {
  if (typeof o === "string") return ascii(o);
  if (Array.isArray(o)) return o.map(asciiDeep);
  if (o && typeof o === "object") { const r = {}; for (const k in o) r[k] = asciiDeep(o[k]); return r; }
  return o;
}
function applyLastFeed(j) {
  j = asciiDeep(j);
  const notes = [];
  // 1) future/live shape: categories[vibe] = { place, path, instructions, ... }
  let perVibe = 0;
  if (j.categories) for (const k in j.categories) {
    const c = j.categories[k];
    if (c && !Array.isArray(c) && Array.isArray(c.instructions)) { Feed.categories[k] = c; perVibe++; }
  }
  if (perVibe) notes.push(perVibe + " vibe routes");
  // 2) single OSRM route (pipe/last_feed shape)
  if (!perVibe && j.route && Array.isArray(j.route.instructions)) {
    const instr = j.route.instructions.map(s => s.replace(/\s*-\s*destination$/i, " - home"));
    const viaAt = instr.findIndex(s => /^via /i.test(s));
    const target = viaAt >= 0 ? (j.selected || "play") : "none";
    const base = Feed.categories[target] || {};
    const sel = (j.selected_places && j.selected_places[0]) || base.place;
    const route = {
      place: viaAt >= 0 ? sel : { name: "no detour" },
      summary: j.route.summary || base.summary || "",
      instructions: instr,
      viaStep: viaAt >= 0 ? viaAt + 1 : 999,
      path: zigzagFromTurns(instr, viaAt),
    };
    route.detourIndex = route.path.detourIndex;
    Feed.categories[target] = route;
    notes.push("route -> " + (target === "none" ? "no detour" : target) + " (zigzag from turns)");
  }
  if (j.meta && j.meta.office && j.meta.office.label) { Feed.office = j.meta.office.label; notes.push("work"); }
  if (j.meta && j.meta.home && j.meta.home.label) { Feed.homeLabel = j.meta.home.label; notes.push("home"); }
  feedNote = "feed: baked + last_feed.json (" + (notes.join(", ") || "nothing usable") + ")";
}
function loadLastFeed() {
  Feed = JSON.parse(JSON.stringify(BAKED_FEED));
  feedNote = "feed: baked (Source/feed.lua) - no last_feed.json";
  return fetch("last_feed.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => { if (j) applyLastFeed(j); })
    .catch(() => {})
    .then(() => { document.getElementById("feedNote").textContent = feedNote; });
}

// distance text -> feet (for zigzag lengths)
function feetOf(text) {
  const mi = /(\d+\.?\d*)\s*mi/.exec(text); if (mi) return parseFloat(mi[1]) * 5280;
  const ft = /(\d+\.?\d*)\s*ft/.exec(text); if (ft) return parseFloat(ft[1]);
  return 0;
}
// abstract bent walk from turn list: start bottom heading up, L/R rotate 90deg
function zigzagFromTurns(instr, viaAt) {
  let x = 0, y = 0, dir = 0; // 0 up, 1 right, 2 down, 3 left
  const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
  const pts = [[0, 0]]; let detourIndex = 1;
  instr.forEach((s, i) => {
    const k = turnKind(s);
    if (k === "left") dir = (dir + 3) % 4;
    else if (k === "right") dir = (dir + 1) % 4;
    if (k === "via") { detourIndex = pts.length; return; }
    if (k === "arrive") return;
    const len = Math.max(30, Math.sqrt(feetOf(s)) * 6);
    x += DX[dir] * len; y += DY[dir] * len; pts.push([Math.round(x), Math.round(y)]);
  });
  if (viaAt < 0) detourIndex = 1;
  return { pts, detourIndex };
}

    const t = DAILY.find(d => d.id === countTaskId);
    text(t ? t.label : "", 200, 160, { font: F_SMALL, align: "center" });
    text("B cancel", 200, 222, { font: F_SMALL, align: "center" });
    return;
  }
  clear();
  g.drawImage(ditherField, 0, 0);               // light dotted field
  const o = Math.round(2 * Math.sin(now / 200)); // breathing logo ink
  g.drawImage(logoInk, o, o);
  punchDigit(label, 200, 118);                  // solid blank digit holes
  rect(150, 204, 100, 32, WHITE);
  text(countAction || "Capture", 200, 207, { font: F_SMALL, align: "center" });
  text("B cancel", 200, 222, { font: F_SMALL, align: "center" });
}

// ------------------------------------------------------------ countdown ---
function clearCountdown() { if (countTimer) clearTimeout(countTimer); countTimer = null; countN = 0; countAction = null; countTaskId = null; }
function startCountdown(action, taskId, fromAsk) {
  clearCountdown(); trayOpen = false;
  countAction = action; countTaskId = taskId || null; countFromAsk = !!fromAsk; countN = 3; go("countdown");
  sfx(action === "TaskBump" ? "confirm" : "whoosh");
  const step = () => { countTimer = setTimeout(() => { countN--; if (countN <= 0) finishCountdown(); else { sfx("tick"); step(); } }, 1000); };
  step();
}
function finishCountdown() {
  const act = countAction, tid = countTaskId, fromAsk = countFromAsk; clearCountdown();
  if (act === "Capture") {
    const p = route().place;
    saved.unshift({ kind: "free", category: selected, label: ASK.title,
      location: selected !== "none" && p ? p.name : "along the walk", when: nowDate() + " " + nowTime(), image: ASK.image });
    persist(); sfx("chirp"); go(fromAsk ? "ask" : "path");
  } else if (act === "Ask") { askLayer = 0; sfx("chirp"); go("ask"); }
  else if (act === "TaskBump") {
    const d = DAILY.find(t => t.id === tid);
    if (d && (tasks[tid] || 0) < d.max) {
      tasks[tid] = (tasks[tid] || 0) + 1; xpTotal++;
      saved.unshift({ kind: "task", label: d.label, task: d.label, location: (route().place && selected !== "none") ? route().place.name : "along the walk", when: nowDate() + " " + nowTime(), image: "entry" });
      persist(); sfx("chirp");
    }
    go("tasks");
  } else go("path");
}

// ---------------------------------------------------------------- input ---
const wrap = (i, d, n) => ((i + d) % n + n) % n;
function input(k) {
  unlockAudio();
  const isCrank = k === "crankUp" || k === "crankDown", cd = k === "crankUp" ? 1 : k === "crankDown" ? -1 : 0;
  switch (state) {
    case "splash":
      if (k === "a") { go("home"); enterMenuFanfare(); }
      break;
    case "home":
      if (k === "up" || k === "down" || isCrank) { homeIdx = wrap(homeIdx, k === "up" ? -1 : k === "down" ? 1 : cd, HOME_ITEMS.length); sfx("tick"); }
      else if (k === "a") {
        sfx("confirm"); const it = HOME_ITEMS[homeIdx];
        if (it === "Start") { catIndex = 0; go("vibe"); }
        else if (it === "Detour log") { logScroll = 0; go("log"); }
        else if (it === "Captures") { capFolder = "free"; go("folders"); }
        else { tasksFromHome = true; taskIdx = 0; sfx("task"); go("tasks"); } // Daily tasks → task.wav
      } else if (k === "b") { sfx("tick"); go("splash"); }
      break;
    case "vibe":
      if (k === "up" || k === "down" || isCrank) { catIndex = wrap(catIndex, k === "up" ? -1 : k === "down" ? 1 : cd, CAT_KEYS.length); sfx("tick"); }
      else if (k === "a") { sfx("confirm"); selected = CAT_KEYS[catIndex]; go("loading"); }
      else if (k === "b") { sfx("tick"); go("home"); }
      break;
    case "loading": break; // silent
    case "countdown":
      if (k === "b") { sfx("deny"); const back = countAction === "TaskBump" ? "tasks" : (countFromAsk ? "ask" : "path"); clearCountdown(); go(back); }
      break;
    case "log": {
      const vis = 5, maxS = Math.max(0, detourLog.length - vis);
      if (k === "up" || k === "down" || isCrank) {
        const before = logScroll;
        logScroll = Math.max(0, Math.min(maxS, logScroll + (k === "up" ? -1 : k === "down" ? 1 : cd)));
        if (logScroll !== before) sfx("tick");
      } else if (k === "b") { sfx("tick"); go("home"); }
      else if (k === "a") sfx("deny");
      break;
    }
    case "folders":
      if (k === "left" || k === "right" || isCrank) { capFolder = capFolder === "free" ? "task" : "free"; sfx("tick"); }
      else if (k === "a") { if (capturesOf(capFolder).length) { sfx("confirm"); capTileIdx = 0; go("tiles"); } else sfx("deny"); }
      else if (k === "b") { sfx("tick"); go("home"); }
      break;
    case "tiles": {
      const n = Math.max(1, capturesOf(capFolder).length);
      const d = { left: -1, right: 1, up: -4, down: 4 }[k] || cd;
      if (d) { capTileIdx = wrap(capTileIdx, d, n); sfx("tick"); }
      else if (k === "a") { if (capturesOf(capFolder).length) { sfx("confirm"); capViewIdx = capTileIdx; go("view"); } else sfx("deny"); }
      else if (k === "b") { sfx("tick"); go("folders"); }
      break;
    }
    case "view": {
      const n = Math.max(1, capturesOf(capFolder).length);
      const d = k === "left" ? -1 : k === "right" ? 1 : cd;
      if (d) { capViewIdx = wrap(capViewIdx, d, n); sfx("tick"); }
      else if (k === "b") { sfx("tick"); capTileIdx = capViewIdx; go("tiles"); }
      break;
    }
    case "path":
      if (trayOpen) {
        if (k === "up" || k === "down" || isCrank) { trayIdx = wrap(trayIdx, k === "up" ? -1 : k === "down" ? 1 : cd, TRAY.length); sfx("tick"); }
        else if (k === "a") {
          const act = TRAY[trayIdx];
          if (act === "Tasks") { sfx("task"); trayOpen = false; tasksFromHome = false; taskIdx = 0; go("tasks"); }
          else startCountdown(act); // whoosh
        } else if (k === "b") { sfx("tick"); trayOpen = false; }
      } else {
        if (isCrank || k === "left" || k === "right") { const n = instructions().length; if (n) { stepIndex = wrap(stepIndex, k === "left" ? -1 : k === "right" ? 1 : cd, n); sfx("tick"); } }
        else if (k === "a") { sfx("confirm"); trayIdx = 0; trayOpen = true; }
        else if (k === "b") { sfx("tick"); go("home"); }
      }
      break;
    case "ask":
      if (isCrank || k === "left" || k === "right") { askLayer = wrap(askLayer, k === "left" ? -1 : k === "right" ? 1 : cd, ASK.layers.length); sfx("tick"); }
      else if (k === "a") startCountdown("Capture", null, true);
      else if (k === "b") { sfx("tick"); go("path"); }
      break;
    case "tasks":
      if (k === "up" || k === "down" || isCrank) { taskIdx = wrap(taskIdx, k === "up" ? -1 : k === "down" ? 1 : cd, DAILY.length); sfx("tick"); }
      else if (k === "a") { const t = DAILY[taskIdx]; if ((tasks[t.id] || 0) < t.max) startCountdown("TaskBump", t.id); else sfx("deny"); }
      else if (k === "b") { sfx("tick"); go(tasksFromHome ? "home" : "path"); }
      break;
  }
}
function enterMenuFanfare() { if (!fanfareDone && audioReady) { fanfareDone = true; sfx("ask"); } } // opening sound = ask.wav (was fanfare)

const KEYMAP = { ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  x: "a", X: "a", Enter: "a", a: "a", A: "a", z: "b", Z: "b", Backspace: "b", b: "b", B: "b",
  "[": "crankDown", "]": "crankUp", ",": "crankDown", ".": "crankUp" };
window.addEventListener("keydown", e => {
  if (e.key === "m" || e.key === "M") { toggleMute(); return; }
  const k = KEYMAP[e.key]; if (!k) return;
  e.preventDefault(); if (e.repeat && (k === "a" || k === "b")) return; input(k);
});
document.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => input(b.dataset.k)));
let wheelAcc = 0;
cv.addEventListener("wheel", e => {
  e.preventDefault(); wheelAcc += e.deltaY;
  while (Math.abs(wheelAcc) >= 40) { input(wheelAcc > 0 ? "crankUp" : "crankDown"); wheelAcc -= 40 * Math.sign(wheelAcc); }
}, { passive: false });
cv.addEventListener("click", () => unlockAudio());
function toggleMute() { muted = !muted; unlockAudio(); updateSndLabel(); document.getElementById("btnMute").textContent = muted ? "unmute (M)" : "mute (M)"; }
document.getElementById("btnMute").addEventListener("click", toggleMute);
document.getElementById("btnReset").addEventListener("click", () => { try { localStorage.removeItem(STORE); } catch (e) {} restore(); go("home"); });
document.getElementById("btnFeed").addEventListener("click", () => loadLastFeed());

// ----------------------------------------------------------------- loop ---
const DRAW = { splash: drawSplash, home: drawHome, vibe: drawVibe, loading: drawLoading, path: drawPath, ask: drawAsk,
  tasks: drawTasks, log: drawLog, folders: drawFolders, tiles: drawTiles, view: drawCapView, countdown: drawCountdown };
function tick(now) {
  if (state === "splash" && now - stateAt > SPLASH_MS) { go("home"); enterMenuFanfare(); }
  if (state === "loading" && now - stateAt > LOAD_MS) {
    stepIndex = 0; trayOpen = false;
    const p = route().place;
    detourLog.unshift({ vibe: selected, place: selected === "none" ? "no detour" : (p ? p.name : "?"), when: nowDate(), time: nowTime() });
    persist(); go("path");
  }
  (DRAW[state] || drawSplash)(now);
  oneBit();
  requestAnimationFrame(tick);
}
restore();
loadImages().then(() => { prepDerived(); return loadLastFeed(); }).then(() => { stateAt = performance.now(); requestAnimationFrame(tick); });
</script>
